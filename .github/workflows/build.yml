name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize and Sync Android Platform
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android project incomplete or gradlew missing. Recreating native Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "Android platform and gradlew ready. Syncing Capacitor..."
            npx cap sync android
          fi

          chmod +x android/gradlew

          echo "Applying GreatStar custom icons..."
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            if [ -d "android/app/src/main/res/mipmap-$d" ] && [ -f "public/ic_launcher.png" ]; then
              cp public/ic_launcher.png "android/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp public/ic_launcher.png "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
              cp public/ic_launcher_foreground.png "android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png"
            fi
          done

          if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
            sed -i 's/#FFFFFF/#0d1117/g' android/app/src/main/res/values/ic_launcher_background.xml || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatStar-ZNW-AutoWiring-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

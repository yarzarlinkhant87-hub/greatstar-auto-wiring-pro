name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize and Sync Android Platform
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android project incomplete or gradlew missing. Recreating native Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "Android platform and gradlew ready. Syncing Capacitor..."
            npx cap sync android
          fi

          echo "Applying GreatStar custom icons..."
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ -f "public/pwa-192x192.png" ]; then
              cp public/pwa-192x192.png "$dir/ic_launcher.png" || true
              cp public/pwa-192x192.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-192x192.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatStar-ZNW-AutoWiring-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
